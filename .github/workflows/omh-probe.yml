name: omh win-exec-paths probe
on:
  push:
    branches: ['proof/omh-win-exec-paths-probe']
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py311
        with: {python-version: '3.11'}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        id: py312
        with: {python-version: '3.12'}
      - name: probe
        timeout-minutes: 10
        shell: powershell
        run: python .proof/driver.py "${{ steps.py311.outputs.python-path }}" "${{ steps.py312.outputs.python-path }}"
